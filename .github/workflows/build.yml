name: Build
on:
    push:
        branches:
            - master
    pull_request:
        types: [opened, synchronize, reopened]

# Add concurrency to cancel outdated builds
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 9
                  run_install: false

            - name: Install Dependencies (Electron)
              run: |
                  cd electron
                  pnpm install
                  cd ..

            - name: Run Electron Tests with Coverage
              run: |
                  cd electron
                  pnpm coverage
                  cd ..

            - name: Install Dependencies (Client)
              run: |
                  cd client
                  pnpm install 
                  cd ..

            - name: Run Client Tests with Coverage
              run: |
                  cd client
                  pnpm coverage
                  cd ..

    build:
        name: Build (${{ matrix.os }}-${{ matrix.arch }})
        needs: [test]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60 # Set maximum job runtime
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      node-version: 22.x
                      arch: x64
                    # windows-latest ships Visual Studio 2026, which electron-builder's node-gyp can't detect yet
                    - os: windows-2022
                      node-version: 22.x
                      arch: x64
                    - os: macos-15-intel
                      node-version: 22.x
                      arch: x64
                    - os: macos-latest
                      node-version: 22.x
                      arch: arm64

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 9
                  run_install: false

            - name: Get Package Version
              id: package_version
              shell: bash
              run: echo "PACKAGE_VERSION=$(node -p -e "require('./electron/package.json').version")" >> $GITHUB_ENV

            - name: Setup Sentry Release
              if: runner.os == 'Linux'
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
              run: |
                  pnpm dlx @sentry/cli releases set-commits "${{ env.PACKAGE_VERSION }}" --commit "${{ github.repository }}@${{ github.sha }}"
                  pnpm dlx @sentry/cli releases new "${{ env.PACKAGE_VERSION }}"

            - name: Install Python Setuptools on Ubuntu
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y python3-setuptools

            - name: Install Python Setuptools on macOS
              if: runner.os == 'macOS'
              run: brew install python-setuptools

            - name: Install Python Setuptools on Windows
              if: runner.os == 'Windows'
              run: |
                  python -m pip install --upgrade pip
                  pip install setuptools

            - name: Install Dependencies (Electron)
              run: |
                  cd electron
                  pnpm install
                  cd ..

            - name: Install Dependencies (Client)
              run: |
                  cd client
                  pnpm install 
                  cd ..

            - name: Build Client
              env:
                  VITE_TEMPLATE_ID: ${{ secrets.VITE_TEMPLATE_ID }}
                  VITE_SERVICE_ID: ${{ secrets.VITE_SERVICE_ID }}
                  VITE_USER_ID: ${{ secrets.VITE_USER_ID }}
              run: |
                  cd client
                  pnpm build
                  cd ..

            - name: Create .env file
              shell: bash
              run: |
                  cd electron
                  echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
                  cd ..

            - name: Build and Release Electron App
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os != 'Windows' }}

              run: |
                  cd electron
                  # Add flag to reduce console output
                  export ELECTRON_BUILDER_SILENT=true
                  pnpm build
                  pnpm prepare_client
                  if [[ "${{ runner.os }}" == "macOS" ]]; then
                    pnpm release -- --mac --arch=${{ matrix.arch }}
                  elif [[ "${{ runner.os }}" == "Windows" ]]; then
                    pnpm release -- --win
                  else
                    pnpm release -- --linux
                  fi
                  cd ..

            - name: Upload Sentry Sourcemaps
              if: runner.os == 'Linux'
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
              run: |
                  pnpm dlx @sentry/cli releases files "${{ env.PACKAGE_VERSION }}" upload-sourcemaps ./client/dist/assets/ --rewrite --url-prefix "~/dist/assets"
                  pnpm dlx @sentry/cli releases files "${{ env.PACKAGE_VERSION }}" list
                  pnpm dlx @sentry/cli releases finalize "${{ env.PACKAGE_VERSION }}"

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.os }}-build
                  path: |
                      electron/packaged/*.dmg
                      electron/packaged/*.AppImage
                      electron/packaged/*.deb
                      electron/packaged/*.rpm
                      electron/packaged/*.exe
                      electron/packaged/*.msi
